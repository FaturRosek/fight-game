<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>IRON RIVALS — 2.5D Arcade Fighting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Teko:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-container"></div>
    <button
      id="fullscreen-toggle-btn"
      type="button"
      aria-label="Toggle Fullscreen"
    >
      &#x26F6; FULL SCREEN
    </button>
    <div id="orientation-overlay" aria-hidden="true">
      <div class="orientation-card">
        <div class="rotate-icon">&#8635;</div>
        <h2>ROTATE YOUR DEVICE</h2>
        <p>
          Turn your phone horizontally to enter the Iron Rivals combat arena.
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
